name: Deploy Version-B Demonstrator
on:
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/deploy-version-b-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site at root and preserve /ui/ path
        run: |
          rm -rf site
          mkdir -p site site/ui
          cp -R ui/. site/
          cp -R ui/. site/ui/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
